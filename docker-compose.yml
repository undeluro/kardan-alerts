# One command from a fresh clone:  docker compose up --build
#
#   UI + API ...... http://localhost:8080
#   Mailpit ....... http://localhost:8025   (every email the service sends)
#   Phones ........ http://localhost:8090   (SMS / voice gateway simulator, failure injection)
#   Metrics ....... http://localhost:8080/metrics, Prometheus :9090, Grafana :3000
#
# Scale the workers horizontally:  docker compose up -d --scale worker=3
name: kardan

x-kardan: &kardan
  image: kardan:dev
  restart: unless-stopped
  environment: &kardan-env
    POSTGRES_URL: postgres://kardan:kardan@postgres:5432/kardan?sslmode=disable
    REDIS_ADDR: redis:6379
    KAFKA_BROKERS: redpanda:9092
    SMTP_ADDR: mailpit:1025
    PUBLIC_URL: http://localhost:8080
    GATEWAY_URL: http://gateway:8090
    GATEWAY_PUBLIC_URL: http://localhost:8090
    GATEWAY_TOKEN: dev-gateway-token # shared secret for SMS/voice calls and inbound replies
    DEMO_MODE: "true"                # allows shifting the business clock from the Teams page
    APPROVAL_SECRET: dev-approval-secret # signs one-click approval links in emails (same on every replica)
    MOCKOPS_URL: http://mockops        # where runbook actions go (config/actions.yaml)
  volumes:
    - ./config:/app/config:ro # edit rules/teams without rebuilding
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    redpanda: { condition: service_healthy }
    mailpit: { condition: service_started }

services:
  # Edge replicas: HTTP ingest, REST API, live feed, UI.
  api:
    <<: *kardan
    build: . # builds kardan:dev once; worker reuses the same image
    environment:
      <<: *kardan-env
      ROLES: api,ingest
      # Optional Claude assistance (rule drafts, runbook structuring). Without a
      # key the built-in readers are used. Teams opt in with aiAssist: true.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ASSIST: ${AI_ASSIST:-on}
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./samples/logs:/var/log/kardan-samples:ro # tailed by the file sources in config/sources.yaml

  # Worker replicas: rules, dedup, alerts, outbox delivery. Stateless; scale freely
  # (up to the events topic's partition count for processing parallelism).
  worker:
    <<: *kardan
    pull_policy: never # local image built by the api service
    environment:
      <<: *kardan-env
      ROLES: processor,dispatcher

  # Simulated SMS / voice provider with a phone simulator page.
  gateway:
    image: kardan:dev
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["fakegw"]
    healthcheck:
      test: ["CMD", "fakegw", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      KARDAN_URL: http://api:8080
      GATEWAY_TOKEN: dev-gateway-token
    ports:
      - "8090:8090"
    depends_on:
      api: { condition: service_started }

  # Simulated operations estate that runbook actions call: workflow engine,
  # service manager, ticketing, payments hub, market data, trading controls.
  # Also answers as counterparty-service (Appendix B's health check).
  mockops:
    image: kardan:dev
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["mockops"]
    environment:
      MOCKOPS_ADDR: ":80"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0 # non-root process on port 80
    healthcheck:
      test: ["CMD", "mockops", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      default:
        aliases: [counterparty-service]
    ports:
      - "8091:80"

  redpanda:
    image: redpandadata/redpanda:v25.1.1
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - redpanda:/var/lib/redpanda/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kardan
      POSTGRES_PASSWORD: kardan
      POSTGRES_DB: kardan
    command: ["postgres", "-c", "max_connections=300", "-c", "synchronous_commit=on"]
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kardan -d kardan"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  # Metrics: every replica, scraped every 5 s. Dashboards in Grafana.
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kardan.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]

  # Load generator (not started by default):
  #   docker compose run --rm loadgen -scenario storm -rate 200 -duration 60s
  loadgen:
    image: kardan:dev
    pull_policy: never
    profiles: [tools]
    entrypoint: ["loadgen"]
    environment:
      KARDAN_URL: http://api:8080
      GATEWAY_URL: http://gateway:8090
      PROMETHEUS_URL: http://prometheus:9090
      KAFKA_BROKERS: redpanda:9092
    volumes:
      - ./loadtest:/loadtest

volumes:
  redpanda:
  postgres:
