# Anna (personal): anything critical from payments-api -> SMS between 08:00 and
# 20:00, otherwise email. The time window lives in Anna's preferences in
# teams.yaml (her time zone), so the rule only says "use her preferences".
id: anna-payments-critical
name: Anna — critical payments-api alerts
team: payments
match:
  all:
    - { field: $severity, op: eq, value: critical }
    - { field: $service,  op: eq, value: payments-api }
routing:
  - { to: user:anna, channels: [preferences, ui] }
presentation:
  title: "{{$type}} on {{$service}}"
  body: "{{annotations.summary}}"
  fields:
    - Region=labels.region
    - Status=status
    - Since=startsAt
# Alertmanager sends the same alert with status "resolved" when it clears:
# close the alert and tell Anna "all clear". Otherwise close after 2 h quiet.
autoResolve:
  when: { field: status, op: eq, value: resolved }
  after: 2h
