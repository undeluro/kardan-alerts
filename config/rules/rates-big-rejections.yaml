# Team Rates: trade.rejected.* where desk = rates and notional > 10,000,000
# -> email + UI; title "Rejected {{payload.currency}} {{payload.notional}} — {{payload.reason}}".
id: rates-big-rejections
name: Large rates-desk trade rejected
team: rates
match:
  all:
    - { field: meta.schema,      op: glob, value: "trade.rejected.*" }
    - { field: payload.desk,     op: eq,   value: rates }
    - { field: payload.notional, op: gt,   value: 10000000 }
routing:
  - { to: team:rates, channels: [email, ui] }
presentation:
  title: "Rejected {{payload.currency}} {{payload.notional | number}} — {{payload.reason}}"
  fields:
    - Trade=payload.tradeId
    - Desk=payload.desk
    - Notional=payload.notional
    - Currency=payload.currency
    - Producer=meta.producer
  severity: warning
  color: amber
dedup:
  key: "{{payload.tradeId}}"
