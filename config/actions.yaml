# Kinds of runbook actions. Adding one is a few lines: an HTTP call with a
# templated URL. The step's parameters are path-escaped into the URL and sent
# as JSON with the alert id, title, requester and approver.
#
# Built in (no entry needed): http_get, call_webhook, wait, escalate.
#
# risk: low | medium | high. High-risk actions always need a second person's
# approval (four-eyes), even if a runbook says "approval: none".
#
# Targets here point at cmd/mockops, the simulated operations estate for the
# demo (workflow engine, service manager, ticketing, payments hub, market
# data, trading controls). In production they would be the real systems.

# Requests go only to these hosts: runbook text is user input (SSRF guard).
allowedHosts: [mockops, counterparty-service, localhost, 127.0.0.1]

targets:
  ops: ${MOCKOPS_URL:-http://mockops}

actions:
  - type: retry_workflow
    label: "Retry workflow {{workflowId}}"
    description: Re-run a failed workflow from the step that failed.
    risk: medium
    params: [workflowId]
    request: { method: POST, url: "{{ops}}/workflows/{{workflowId}}/retry" }

  - type: restart_service
    label: "Restart {{service}}"
    description: Restart one service instance.
    risk: medium
    params: [service]
    request: { method: POST, url: "{{ops}}/services/{{service}}/restart" }

  - type: open_ticket
    label: "Open a ticket: {{summary}}"
    description: Create an incident ticket for a team.
    risk: low
    params: [summary, team?]
    request: { method: POST, url: "{{ops}}/tickets" }

  - type: notify_channel
    label: "Post to {{channel}}"
    description: Post a message to a chat channel (e.g. #payments-incidents).
    risk: low
    params: [channel, message?]
    request: { method: POST, url: "{{ops}}/chat/{{channel}}" }

  - type: notify_risk
    label: "Notify Risk: {{summary}}"
    description: Tell the risk function about a limit breach or exposure.
    risk: low
    params: [summary, desk?]
    request: { method: POST, url: "{{ops}}/risk/notifications" }

  - type: failover_feed
    label: "Fail {{instrument}} over to the secondary vendor feed"
    description: Switch an instrument's market data to the backup vendor.
    risk: medium
    params: [instrument]
    request: { method: POST, url: "{{ops}}/feeds/{{instrument}}/failover" }

  - type: failover_region
    label: "Fail {{service}} traffic over to the other region"
    description: Move a service's traffic to the standby region.
    risk: high
    params: [service]
    request: { method: POST, url: "{{ops}}/regions/failover/{{service}}" }

  - type: rollback_deployment
    label: "Roll back the last deployment of {{service}}"
    description: Revert a service to its previous release.
    risk: high
    params: [service]
    request: { method: POST, url: "{{ops}}/deployments/{{service}}/rollback" }

  - type: resubmit_payment
    label: "Resubmit payment {{endToEndId}}"
    description: Release a repaired payment to the payment system again.
    risk: high
    params: [endToEndId]
    request: { method: POST, url: "{{ops}}/payments/{{endToEndId}}/resubmit" }

  - type: pause_trading
    label: "Pause trading on the {{desk}} desk (kill switch)"
    description: Stop new orders from a desk until it is released.
    risk: high
    params: [desk]
    request: { method: POST, url: "{{ops}}/trading/desks/{{desk}}/pause" }
